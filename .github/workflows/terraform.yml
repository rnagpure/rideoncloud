name: Terraform

on:
  push:
    branches: [ develop, staging, main ]
    paths:
      - "Core/**"
      - "App/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to deploy"
        required: true
        type: choice
        options:
          - all
          - core
          - app
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.filter.outputs.core }}
      app_changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'Core/**'
              - 'modules/**'
              - '*.tf'
            app:
              - 'App/**'
              - 'modules/**'
              - '*.tf'

  terraform:
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: rideoncloud-${{ steps.config.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment and targets
        id: config
        run: |
          # ── Environment ──────────────────────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            BRANCH="${GITHUB_REF##*/}"
            case "$BRANCH" in
              develop) ENV="dev"     ;;
              staging) ENV="staging" ;;
              main)    ENV="prod"    ;;
            esac
          fi

          # ── Target flags ─────────────────────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE="${{ github.event.inputs.module }}"
          else
            # auto-detect from changed paths
            CORE="${{ needs.detect-changes.outputs.core_changed }}"
            APP="${{ needs.detect-changes.outputs.app_changed }}"

            if [ "$CORE" = "true" ] && [ "$APP" = "true" ]; then
              MODULE="all"
            elif [ "$CORE" = "true" ]; then
              MODULE="core"
            elif [ "$APP" = "true" ]; then
              MODULE="app"
            else
              MODULE="none"
            fi
          fi

          # ── Build -target args ────────────────────────────────────
          case "$MODULE" in
            core) TARGET="-target=module.core" ;;
            app)  TARGET="-target=module.app"  ;;
            all)  TARGET=""                    ;;
            none) TARGET="skip"                ;;
          esac

          echo "env=$ENV"                        >> $GITHUB_OUTPUT
          echo "workspace=rideoncloud-$ENV"      >> $GITHUB_OUTPUT
          echo "target=$TARGET"                  >> $GITHUB_OUTPUT
          echo "module=$MODULE"                  >> $GITHUB_OUTPUT

      - name: Skip if no relevant changes
        if: steps.config.outputs.target == 'skip'
        run: |
          echo "No relevant changes detected. Skipping deploy."
          exit 0

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        if: steps.config.outputs.target != 'skip'
        run: terraform init

      - name: Terraform Plan
        if: steps.config.outputs.target != 'skip'
        run: |
          terraform plan \
            ${{ steps.config.outputs.target }} \
            -var-file="environments/${{ steps.config.outputs.env }}.tfvars" \
            -var="tfc_workspace=${{ steps.config.outputs.workspace }}"

      - name: Terraform Apply
        if: steps.config.outputs.target != 'skip'
        run: |
          terraform apply -auto-approve \
            ${{ steps.config.outputs.target }} \
            -var-file="environments/${{ steps.config.outputs.env }}.tfvars" \
            -var="tfc_workspace=${{ steps.config.outputs.workspace }}"
