name: Terraform

on:
  push:
    branches: [ develop, staging, main ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment from branch
        run: |
          BRANCH="${GITHUB_REF##*/}"
          case "$BRANCH" in
            develop) ENV="dev" ;;
            staging) ENV="staging" ;;
            main)    ENV="prod"    ;;
          esac
          echo "ENV=$ENV"                     >> $GITHUB_ENV
          echo "TFC_WORKSPACE=myapp-$ENV"     >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="environments/${{ env.ENV }}.tfvars" \
            -var="tfc_workspace=${{ env.TFC_WORKSPACE }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var-file="environments/${{ env.ENV }}.tfvars" \
            -var="tfc_workspace=${{ env.TFC_WORKSPACE }}"
